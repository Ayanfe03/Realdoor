name: Python Test Suite

on:
  push:
    branches: [ main, master, core ]
  pull_request:
    branches: [ main, master, core ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull down your repository code into the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Boot up a clean Python runtime environment
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Matches your stable runtime profile

    # 3. Cache dependencies to keep your workflow runs blazing fast
    - name: Cache Pip Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install your application packages and dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f starter/requirements.txt ]; then
          pip install -r starter/requirements.txt
        elif [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        pip install pytest fastapi httpx uvicorn pydantic lucide-react # Guarantees test utilities exist

    # 5. Run the exact python module test execution command you validated locally
    - name: Run Pytest Suite
      run: |
        cd starter
        python -m pytest -v
